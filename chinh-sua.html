<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chỉnh lịch thiệp mời · Lê Quang Minh</title>
  <style>
    :root { --navy: #032b91; --ink: #152442; --muted: #526078; --line: #cbd7e8; }
    *, *::before, *::after { box-sizing: border-box; }
    body { display: grid; place-items: center; min-height: 100svh; margin: 0; padding: 1rem; background: #eef3fa; color: var(--ink); font: 1rem/1.55 system-ui, sans-serif; }
    main { width: min(100%, 34rem); padding: clamp(1.35rem, 5vw, 2.5rem); border: 1px solid #dce4ef; border-radius: 1rem; background: #fff; }
    h1 { margin: 0; color: var(--ink); font: 700 clamp(1.8rem, 6vw, 2.65rem)/1.13 Georgia, serif; }
    p { margin: 0; }
    .intro { margin: .6rem 0 1.3rem; color: var(--muted); }
    form { display: grid; gap: .65rem; }
    label { display: block; font-weight: 600; }
    input, button { font: inherit; }
    input { width: 100%; min-width: 0; min-height: 2.8rem; padding: .6rem .7rem; border: 1px solid var(--line); border-radius: .5rem; background: white; color: var(--ink); }
    .date-row, .times { display: grid; gap: .55rem; }
    .date-row { grid-template-columns: minmax(0, 1fr) auto; }
    .times { grid-template-columns: repeat(2, minmax(0, 1fr)); margin-block: .45rem; }
    .times input { margin-top: .3rem; }
    .picker { position: relative; display: grid; place-items: center; width: 2.8rem; border: 1px solid var(--line); border-radius: .5rem; color: var(--navy); background: #eaf1fd; }
    .picker svg { width: 1.15rem; height: 1.15rem; fill: none; stroke: currentColor; stroke-width: 1.75; }
    .picker input { position: absolute; inset: 0; height: 100%; width: 100%; opacity: 0; cursor: pointer; }
    .picker input::-webkit-calendar-picker-indicator { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; padding: 0; cursor: pointer; }
    button { justify-self: start; min-height: 2.8rem; padding: .6rem .95rem; border: 0; border-radius: .5rem; background: var(--navy); color: #fff; font-weight: 700; cursor: pointer; }
    button:hover { background: #1746b2; }
    :focus-visible, .picker:focus-within { outline: 3px solid #1488db; outline-offset: 3px; }
    .help, #status { color: var(--muted); font-size: .875rem; }
    #status:not(:empty) { padding: .65rem .75rem; border-radius: .45rem; background: #e5f4ed; color: #15463b; }
    #status:empty { display: none; }
  </style>
</head>
<body>
  <main>
    <h1>Chỉnh lịch thiệp mời</h1>
    <p class="intro">Chọn ngày và giờ của buổi lễ Lê Quang Minh. Thay <code>index.html</code> trong repo bằng tệp vừa tạo. Đặt các tệp nhạc và ảnh cùng cấp với <code>index.html</code>.</p>
    <form id="editor">
      <label for="input-date">Ngày tổ chức</label>
      <div class="date-row">
        <input id="input-date" type="text" inputmode="numeric" placeholder="DD/MM/YYYY" maxlength="10" aria-describedby="date-help" required>
        <span class="picker" title="Chọn ngày trên lịch">
          <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4m8-4v4"/></svg>
          <input id="pick-date" type="date" aria-label="Chọn ngày trên lịch">
        </span>
      </div>
      <p class="help" id="date-help">Nhập DD/MM/YYYY hoặc bấm biểu tượng lịch.</p>
      <div class="times">
        <label for="input-start">Giờ bắt đầu<input id="input-start" type="text" inputmode="numeric" placeholder="HH:MM" maxlength="5" required></label>
        <label for="input-end">Giờ kết thúc<input id="input-end" type="text" inputmode="numeric" placeholder="HH:MM" maxlength="5" required></label>
      </div>
      <p class="help">Giờ Việt Nam (UTC+7)</p>
      <button type="submit">Tải index.html để đăng</button>
      <p id="status" role="status"></p>
    </form>
  </main>

  <script>
    'use strict';
    const find = id => document.getElementById(id);
    const inputDate = find('input-date');
    const picker = find('pick-date');
    const inputStart = find('input-start');
    const inputEnd = find('input-end');
    const timePattern = /^(?:[01]\d|2[0-3]):[0-5]\d$/;
    const templateBytes = Uint8Array.from(atob(find('invitation-source').textContent), character => character.charCodeAt(0));
    const invitationSource = new TextDecoder().decode(templateBytes);
    const parseInvitation = () => new DOMParser().parseFromString(invitationSource, 'text/html');
    const settings = JSON.parse(parseInvitation().getElementById('event-data').textContent);

    function validDate(value) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(value) || value.startsWith('0000')) return false;
      const day = new Date(value + 'T00:00:00Z');
      return Number.isFinite(day.getTime()) && day.toISOString().slice(0, 10) === value;
    }

    function readDate() {
      const parts = /^(\d{2})\/?(\d{2})\/?(\d{4})$/.exec(inputDate.value.trim());
      return parts ? parts.slice(1).reverse().join('-') : '';
    }

    function readTime(input) {
      return input.value.trim().replace(/^(\d{2})(\d{2})$/, '$1:$2');
    }

    function requireValue(input, valid, message) {
      input.setCustomValidity(valid ? '' : message);
      return input.reportValidity();
    }

    inputDate.value = settings.date.split('-').reverse().join('/');
    picker.value = settings.date;
    inputStart.value = settings.startTime;
    inputEnd.value = settings.endTime;

    picker.addEventListener('click', () => {
      try { picker.showPicker?.(); } catch { /* Trình duyệt có thể tự mở lịch. */ }
    });
    picker.addEventListener('change', () => {
      if (!picker.value) return;
      inputDate.value = picker.value.split('-').reverse().join('/');
      inputDate.setCustomValidity('');
    });
    inputDate.addEventListener('input', () => {
      inputDate.setCustomValidity('');
      const date = readDate();
      if (validDate(date)) picker.value = date;
    });
    for (const input of [inputStart, inputEnd]) {
      input.addEventListener('input', () => {
        inputStart.setCustomValidity('');
        inputEnd.setCustomValidity('');
      });
    }

    function exportInvitation(date, startTime, endTime) {
      const page = parseInvitation();
      const config = JSON.stringify({ ...settings, date, startTime, endTime }, null, 2).replace(/</g, '\\u003c');
      page.getElementById('event-data').textContent = '\n' + config + '\n';
      const timestamp = time => date + 'T' + time + ':00+07:00';
      const calendarTime = time => new Date(timestamp(time)).toISOString().replace(/[-:]|\.\d{3}/g, '');
      const weekday = new Intl.DateTimeFormat('vi-VN', { weekday: 'long', timeZone: 'Asia/Ho_Chi_Minh' })
        .format(new Date(timestamp(startTime)));
      const [year, month, day] = date.split('-');
      const shortDate = [day, month, year].join('.');
      const longDate = weekday[0].toLocaleUpperCase('vi-VN') + weekday.slice(1) +
        ', ngày ' + Number(day) + ' tháng ' + Number(month) + ' năm ' + year;

      for (const time of page.querySelectorAll('[data-event-date]')) {
        time.dateTime = date;
        time.textContent = time.dataset.eventDate === 'short' ? shortDate : longDate;
      }
      for (const time of page.querySelectorAll('[data-event-time]')) {
        const hours = time.dataset.eventTime === 'startTime' ? startTime : endTime;
        time.dateTime = timestamp(hours);
        time.textContent = hours;
      }
      const calendar = page.getElementById('google-calendar');
      const url = new URL(calendar.href);
      url.searchParams.set('dates', calendarTime(startTime) + '/' + calendarTime(endTime));
      calendar.href = url.href;
      return '<!doctype html>\n' + page.documentElement.outerHTML + '\n';
    }

    find('editor').addEventListener('submit', submission => {
      submission.preventDefault();
      const date = readDate();
      const startTime = readTime(inputStart);
      const endTime = readTime(inputEnd);
      if (!requireValue(inputDate, validDate(date), 'Nhập ngày hợp lệ theo định dạng DD/MM/YYYY.')) return;
      if (!requireValue(inputStart, timePattern.test(startTime), 'Nhập giờ bắt đầu theo định dạng HH:MM.')) return;
      if (!requireValue(inputEnd, timePattern.test(endTime), 'Nhập giờ kết thúc theo định dạng HH:MM.')) return;
      if (!requireValue(inputEnd, endTime > startTime, 'Giờ kết thúc phải sau giờ bắt đầu.')) return;

      const source = exportInvitation(date, startTime, endTime);
      const url = URL.createObjectURL(new Blob([source], { type: 'text/html;charset=utf-8' }));
      const download = document.createElement('a');
      download.href = url;
      download.download = 'index.html';
      document.body.append(download);
      download.click();
      download.remove();
      window.setTimeout(() => URL.revokeObjectURL(url), 2000);
      find('status').textContent = 'Đã xuất index.html với lịch ' + inputDate.value + ', ' + startTime + '–' + endTime + '.';
    });
  </script>
